name: CD Pipeline

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy a Producción
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test

      - name: Build de producción
        run: npm run build

      - name: Deploy (simulado)
        run: |
          echo "Desplegando aplicación..."
          echo "Versión: $(node -p "require('./package.json').version")"
          echo "Branch: ${GITHUB_REF#refs/heads/}"
          echo "Commit: $GITHUB_SHA"
          echo "Deploy completado exitosamente!"

      - name: Crear tag de release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Creando tag v$VERSION"
          # git tag -a "v$VERSION" -m "Release version $VERSION"
          # git push origin "v$VERSION"

  post-deploy:
    name: Verificación Post-Deploy
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Health Check
        run: |
          echo "Ejecutando health check..."
          echo "Aplicación desplegada y funcionando correctamente"

      - name: Notificar éxito
        run: |
          echo "Deploy completado exitosamente"
          echo "Timestamp: $(date)"
