name: CI Pipeline

on:
  push:
    branches:
      - develop
      - master
      - main
  pull_request:
    branches:
      - develop
      - master
      - main

jobs:
  build-and-test:
    name: Build y Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linter
        run: npm run lint
        continue-on-error: true

      - name: Ejecutar tests
        run: npm test

      - name: Ejecutar build
        run: npm run build

      - name: Subir artefactos
        uses: actions/upload-artifact@v3
        if: success()
        with:
          name: build-artifacts-${{ matrix.node-version }}
          path: |
            src/
            package.json
          retention-days: 5

  code-quality:
    name: Análisis de Calidad de Código
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formato de código
        run: |
          echo "Verificando calidad de código..."
          npm run lint || echo "Advertencia: Lint encontró problemas"

      - name: Reporte de cobertura
        run: |
          echo "Generando reporte de cobertura..."
          npm test -- --coverage || true

  notify:
    name: Notificación de Estado
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality]
    if: always()

    steps:
      - name: Resultado del Pipeline
        run: |
          echo "Pipeline completado"
          echo "Estado: ${{ needs.build-and-test.result }}"
          echo "Calidad: ${{ needs.code-quality.result }}"
